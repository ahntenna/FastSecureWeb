[package]
# 패키지 이름은 바꾸지 않아도 된다(이미지·컨테이너 이름은 docker-compose.yml 이 정한다).
name = "server"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
tower-http = { version = "0.7", features = ["catch-panic"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }

# 보안 채널 암호 연산 (RustCrypto)
p256 = { version = "0.14", features = ["ecdh", "ecdsa", "pem", "pkcs8"] }
aes-gcm = "0.11"
hkdf = "0.13"
hmac = "0.13"
sha2 = "0.11"
base64 = "0.23"
getrandom = "0.4"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# 심볼·디버그 정보를 제거한다(리버싱 지연, 바이너리 축소).
strip = true
debug = false
# panic = "abort" 는 쓰지 않는다. 요청 하나의 패닉이 서버 전체를 내리게 된다.
