# 로컬 Docker 테스트용 겹침 파일. 운영 서버에서는 쓰지 않는다.
#   scripts\docker.bat local up   →  http://127.0.0.1:<WEB_HOST_PORT>
services:
  web:
    ports:
      # 루프백에만 바인딩한다. Docker 가 게시한 포트는 호스트 방화벽 규칙을 우회하므로
      # 0.0.0.0 으로 열지 않는다.
      - "127.0.0.1:${WEB_HOST_PORT}:${WEB_PORT}"

  api:
    environment:
      # http://127.0.0.1 로 접속하므로 로컬 테스트에서만 완화한다.
      ALLOWED_HOSTS: "127.0.0.1,localhost"
      COOKIE_SECURE: "false"
