# 기본 구성. 단독으로는 호스트 포트를 열지 않는다. 용도에 맞는 파일을 겹쳐서 쓴다.
#   로컬 Docker 테스트 : scripts\docker.bat local up   (+ docker-compose.local.yml: 127.0.0.1 포트 게시)
#   운영 (NPM 뒤)      : scripts/docker.sh npm up      (+ docker-compose.npm.yml: NPM 네트워크 연결)
#
# 포트는 ports.env, 운영 설정은 .env 에서 읽는다 (스크립트가 --env-file 로 둘 다 넘긴다).
#
#   인터넷 ─▶ NPM(TLS) ─▶ web(nginx: 정적 파일 + /api 프록시) ─▶ api ─▶ SQLite 볼륨
#                          edge 네트워크        backend 네트워크(internal: 외부로 나가는 경로 없음)
name: __PROJECT_NAME__

services:
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        OBF_DOMAIN_LOCK: ${OBF_DOMAIN_LOCK:-}
    image: __PROJECT_NAME__-web
    container_name: __PROJECT_NAME__-web
    restart: unless-stopped
    environment:
      WEB_PORT: ${WEB_PORT}
      API_HOST: api
      API_PORT: ${API_PORT}
      TRUSTED_PROXY_CIDR: ${TRUSTED_PROXY_CIDR:-172.16.0.0/12}
    read_only: true
    tmpfs:
      - /tmp
      - /etc/nginx/conf.d:uid=101,gid=101,mode=0755   # 템플릿 치환 결과가 쓰이는 곳
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks: [edge, backend]
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 128M
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  api:
    build: ./backend
    image: __PROJECT_NAME__-api
    container_name: __PROJECT_NAME__-api
    restart: unless-stopped
    env_file: .env                      # 커밋하지 않는 파일 (.env.example 참고)
    environment:
      API_PORT: ${API_PORT}
      DATABASE_PATH: /app/data/app.db
      SERVER_SIGN_KEY_FILE: /run/secrets/server_sign_key
      # api 는 backend 네트워크에서 web 을 통해서만 도달되므로 web 이 넣어 준 X-Real-IP 를 신뢰한다.
      TRUST_PROXY_HEADERS: "true"
    secrets:
      - server_sign_key
    volumes:
      - api_data:/app/data              # SQLite 파일. 정기적으로 백업한다.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks: [backend]                 # edge 에 붙이지 않는다. ports 도 없다.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging: *logging

networks:
  edge: {}
  backend:
    internal: true

volumes:
  api_data:

secrets:
  server_sign_key:
    # 서버 장기 서명 개인키. node scripts/gen-keys.mjs 로 만든다. 커밋하지 않는다.
    # 컨테이너 사용자(uid 10001)가 읽을 수 있어야 한다:
    #   sudo chown 10001 secrets/server_sign_key.pem && sudo chmod 400 secrets/server_sign_key.pem
    file: ./secrets/server_sign_key.pem
