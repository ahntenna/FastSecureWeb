# CSP 는 이 파일 한 곳에서 관리한다 (vite preview 도 이 값을 읽는다).
# location 블록에 add_header 가 하나라도 있으면 server 수준의 add_header 는 상속되지 않으므로
# 헤더를 붙이는 모든 location 에서 이 파일을 include 한다.
#
# 외부 리소스(폰트 CDN, 분석 스크립트 등)를 쓰게 되면 해당 지시어에 출처를 정확히 추가한다.
# script-src 에 'unsafe-inline' / 'unsafe-eval' 을 넣지 않는다.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
