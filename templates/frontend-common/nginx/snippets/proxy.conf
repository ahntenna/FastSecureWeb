# /api 를 api 컨테이너로 넘길 때의 공통 설정.
proxy_http_version 1.1;
proxy_set_header Connection "";

# 포트까지 포함한 원래 Host 를 전달한다(앱의 Host·Origin 검사에 쓰인다).
proxy_set_header Host $http_host;

# 클라이언트가 보낸 X-Real-IP / X-Forwarded-For 는 버리고 nginx 가 판단한 주소로 덮어쓴다.
# api 는 이 값을 그대로 신뢰한다(TRUST_PROXY_HEADERS=true). api 가 web 을 통해서만
# 도달되도록 네트워크가 분리돼 있어야 성립한다(docker-compose.yml 의 backend 네트워크).
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

proxy_connect_timeout 5s;
proxy_read_timeout 30s;
proxy_send_timeout 30s;

# 본문 크기 제한 (앱의 MAX_BODY_BYTES 와 맞춘다)
client_max_body_size 1m;
